<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Be My Valentine 💖</title>

<style>
  body {
    margin: 0;
    height: 100vh;
    background: linear-gradient(135deg, #ff9a9e, #fad0c4);
    font-family: 'Comic Sans MS', Arial, sans-serif;
    display: flex;
    justify-content: center;
    align-items: center;
    overflow: hidden;
    position: relative;
  }

  /* Sticker behind everything */
  body::before {
    content: "";
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    background: url('sticker.png') no-repeat center center;
    background-size: 300px;
    width: 300px;
    height: 300px;
    z-index: 0;
    opacity: 0.9;
  }

  /* Floating hearts container */
  .heart {
    position: absolute;
    width: 20px;
    height: 20px;
    background: #ff4d6d;
    transform: rotate(-45deg);
    left: 50%;
    animation: float 5s linear infinite;
    z-index: 0;
  }

  .heart::before,
  .heart::after {
    content: "";
    position: absolute;
    width: 20px;
    height: 20px;
    background: #ff4d6d;
    border-radius: 50%;
  }

  .heart::before {
    top: -10px;
    left: 0;
  }

  .heart::after {
    left: 10px;
    top: 0;
  }

  @keyframes float {
    0% {
      transform: translateX(0) translateY(0) rotate(-45deg);
      opacity: 1;
    }
    100% {
      transform: translateX(calc(-50vw + 50%)) translateY(-100vh) rotate(-45deg);
      opacity: 0;
    }
  }

  .box {
    background: rgba(255, 255, 255, 0.9); /* semi-transparent to see sticker behind */
    width: 650px;
    height: 450px;
    padding: 50px;
    border-radius: 50px;
    box-shadow: 0 30px 70px rgba(0,0,0,0.3);
    text-align: center;
    position: relative;
    z-index: 2;
  }

  h1 {
    color: #ff4d6d;
    font-size: 38px;
    margin-bottom: 80px;
  }

  .buttons {
    display: flex;
    justify-content: center;
    gap: 40px;
  }

  button {
    font-size: 24px;
    padding: 16px 35px;
    border-radius: 25px;
    border: none;
    cursor: pointer;
    box-shadow: 0 8px 20px rgba(0,0,0,0.2);
    transition: transform 0.2s, box-shadow 0.2s;
  }

  #yes {
    background: #ff4d6d;
    color: white;
  }

  #yes:hover {
    transform: scale(1.2);
    box-shadow: 0 12px 25px rgba(0,0,0,0.3);
  }

  #no {
    background: #ffd6e0;
    color: #333;
    position: relative;
  }
</style>
</head>

<body>

<div class="box">
  <h1>Louzaa would you be my Valentine? 🥺💘</h1>
  <div class="buttons">
    <button id="yes">Yes 😍</button>
    <button id="no">No 🥲</button>
  </div>
</div>

<!-- Music -->
<audio id="music" src="https://occupational-ivory-fqhz28k0es.edgeone.app/love-song.mp3" loop></audio>

<script>
  const noBtn = document.getElementById("no");
  const box = document.querySelector(".box");
  const music = document.getElementById("music");

  let activated = false;

  // No button runs away
  noBtn.addEventListener("mouseover", () => {
    if (!activated) {
      const rect = noBtn.getBoundingClientRect();
      const boxRect = box.getBoundingClientRect();

      noBtn.style.position = "absolute";
      noBtn.style.left = (rect.left - boxRect.left) + "px";
      noBtn.style.top = (rect.top - boxRect.top) + "px";

      activated = true;
    }

    const maxX = box.clientWidth - noBtn.offsetWidth;
    const maxY = box.clientHeight - noBtn.offsetHeight;

    const x = Math.random() * maxX;
    const y = Math.random() * maxY;

    noBtn.style.left = x + "px";
    noBtn.style.top = y + "px";
  });

  // Yes button: play music
  document.getElementById("yes").addEventListener("click", () => {
    music.play();
    alert("YAY!! 💕 You just made my heart very happy 😌💘");
  });

  // Generate multiple floating hearts
  for (let i = 0; i < 20; i++) {
    const heart = document.createElement('div');
    heart.classList.add('heart');
    heart.style.left = Math.random() * 100 + 'vw';
    heart.style.animationDuration = 4 + Math.random() * 3 + 's';
    heart.style.width = heart.style.height = 15 + Math.random() * 15 + 'px';
    document.body.appendChild(heart);
  }
</script>

</body>
</html>
